# .github/workflows/test-ssh-secrets.yml
name: Test SSH secrets

on:
  workflow_dispatch:   # kjøres manuelt fra Actions-fanen

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Sett opp SSH-nøkkel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Legg host til known_hosts (unngå prompt)
        run: |
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Test tilkobling
        run: |
          ssh -i ~/.ssh/id_rsa \
              -o StrictHostKeyChecking=yes \
              "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
              "echo '✅ SSH-tilkobling OK'; whoami; pwd"

      - name: Rydd opp
        if: always()
        run: rm -f ~/.ssh/id_rsa